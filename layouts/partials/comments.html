<div style="margin-top: 40px; padding: 20px; background-color: #fcf9f2; border-radius: 8px;">
  <h3>Discussion</h3>
  
  <!-- Where existing comments will load -->
  <div id="comments-container" style="margin-bottom: 20px;">
    <p id="loading-text">Loading comments...</p>
  </div>

  <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

  <!-- The Comment Form -->
  <h4>Leave a Comment</h4>
  <form id="comment-form" style="display: flex; flex-direction: column; gap: 10px;">
    <!-- Hidden field to pass the Hugo post title automatically -->
    <input type="hidden" name="postName" value="{{ .Title }}">
    
    <input type="text" name="who" placeholder="Your Name" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    <textarea name="comment" placeholder="Your Comment" required rows="4" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    
    <button type="submit" style="padding: 10px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">Submit Comment</button>
  </form>
  <p id="success-msg" style="display: none; color: green; margin-top: 10px;">Comment submitted successfully! Refresh to see it.</p>
</div>

<script>
  // YOUR GOOGLE APPS SCRIPT WEB APP URL GOES HERE
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyZeOXASlmTcKrgE1gV0QJQRK8h26XmjkUNzWW325iRf2g2aYF_cU0EiyRW3dF0D7N-sw/exec';
  const postTitle = "{{ .Title }}";
  const container = document.getElementById('comments-container');
  const form = document.getElementById('comment-form');

  // 1. Fetch and display existing comments
  fetch(scriptURL + "?postName=" + encodeURIComponent(postTitle))
    .then(response => response.json())
    .then(data => {
      container.innerHTML = ''; // Clear loading text
      if (data.length === 0) {
        container.innerHTML = '<p style="color: #777;">No comments yet. Be the first!</p>';
        return;
      }
      data.forEach(item => {
        const div = document.createElement('div');
        div.style = "margin-bottom: 15px; padding: 10px; background: white; border-radius: 4px; border: 1px solid #eee;";
        div.innerHTML = `<strong>${item.who}</strong> <span style="font-size: 0.8rem; color: #888;">on ${item.when}</span><p style="margin: 5px 0 0 0;">${item.comment}</p>`;
        container.appendChild(div);
      });
    })
    .catch(error => {
      container.innerHTML = '<p style="color: red;">Error loading comments.</p>';
    });

  // 2. Handle new comment submission
  form.addEventListener('submit', e => {
    e.preventDefault();
    const submitBtn = form.querySelector('button');
    submitBtn.innerText = 'Submitting...';
    submitBtn.disabled = true;

    fetch(scriptURL, { method: 'POST', body: new FormData(form) })
      .then(response => {
        form.reset();
        submitBtn.innerText = 'Submit Comment';
        submitBtn.disabled = false;
        document.getElementById('success-msg').style.display = 'block';
        // Hide success message after 4 seconds
        setTimeout(() => document.getElementById('success-msg').style.display = 'none', 4000);
      })
      .catch(error => console.error('Error!', error.message));
  });
</script>
